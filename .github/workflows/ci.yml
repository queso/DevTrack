name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Guards the release pipeline: bump-plugin-version.sh runs as
      # semantic-release's prepareCmd and must keep plugin.json and
      # marketplace.json version fields in sync.
      - name: Test plugin version bump script
        run: ./scripts/bump-plugin-version.test.sh

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: "web/package.json"

      - uses: actions/setup-node@v6
        with:
          node-version-file: "web/.node-version"
          cache: "pnpm"
          cache-dependency-path: "web/pnpm-lock.yaml"

      - run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Generate Prisma Client
        run: pnpm db:generate
        working-directory: web

      - name: Type Check
        run: pnpm typecheck
        working-directory: web

      - name: Lint & Format
        run: pnpm check
        working-directory: web

      - name: Test
        run: pnpm test
        working-directory: web

  # Build and publish the production web image to GHCR on push to main, so the
  # arcane-k8s cluster can pull ghcr.io/queso/devtrack:main (mirrors the cortex
  # repo's build-and-push job). The Dockerfile lives in web/.
  build-and-push:
    name: Build & Push Image
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            ghcr.io/queso/devtrack:main
            ghcr.io/queso/devtrack:${{ github.sha }}

  # GitOps CD: after the image lands in GHCR, pin arcane-k8s's devtrack
  # deployment to this commit's SHA tag. ArgoCD auto-sync picks up the manifest
  # change and rolls the deployment (the migrate initContainer runs on each
  # rollout). Rollback = git revert in arcane-k8s.
  deploy:
    name: Bump Image in arcane-k8s
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out arcane-k8s
        uses: actions/checkout@v6
        with:
          repository: queso/arcane-k8s
          ssh-key: ${{ secrets.ARCANE_K8S_DEPLOY_KEY }}
          ref: main

      - name: Pin devtrack image to ${{ github.sha }}
        run: |
          sed -i -E 's|(ghcr\.io/queso/devtrack):[A-Za-z0-9._-]+|\1:${{ github.sha }}|g' \
            kubernetes/apps/devtrack/deployment.yaml
          git diff --stat

      - name: Commit and push
        run: |
          git config user.name "devtrack-ci"
          git config user.email "devtrack-ci@theaiteam.dev"
          if git diff --quiet; then
            echo "Image already pinned to ${{ github.sha }} — nothing to do."
            exit 0
          fi
          git add kubernetes/apps/devtrack/deployment.yaml
          git commit -m "chore(devtrack): deploy ghcr.io/queso/devtrack:${{ github.sha }}"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase && continue
          done
          echo "push failed after retries" >&2
          exit 1

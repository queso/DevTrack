name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: "web/package.json"

      - uses: actions/setup-node@v6
        with:
          node-version-file: "web/.node-version"
          cache: "pnpm"
          cache-dependency-path: "web/pnpm-lock.yaml"

      - run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Generate Prisma Client
        run: pnpm db:generate
        working-directory: web

      - name: Type Check
        run: pnpm typecheck
        working-directory: web

      - name: Lint & Format
        run: pnpm check
        working-directory: web

      - name: Test
        run: pnpm test
        working-directory: web

  # Build and publish the production web image to GHCR on push to main, so the
  # arcane-k8s cluster can pull ghcr.io/queso/devtrack:main (mirrors the cortex
  # repo's build-and-push job). The Dockerfile lives in web/.
  build-and-push:
    name: Build & Push Image
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            ghcr.io/queso/devtrack:main
            ghcr.io/queso/devtrack:${{ github.sha }}
